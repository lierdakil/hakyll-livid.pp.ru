{{ define "main" }}
<div class="search-page">
  <h1>Поиск</h1>
  <form id="search-form" class="form-inline">
    <div class="input-group">
      <input id="search-input" type="search" name="q" placeholder="Поиск..." class="form-control" value="" autocomplete="off">
      <span class="input-group-btn">
        <button class="btn btn-default" type="submit">⌕</button>
      </span>
    </div>
  </form>
  <div id="search-results" class="mt-3"></div>
</div>
<script>
  (async function() {
    // Build index from Hugo at build time
    const fetched = await fetch("/index.json");
    const SEARCH_INDEX = await fetched.json();

    const params = new URLSearchParams(window.location.search);
    const query = params.get('q') || '';
    const input = document.getElementById('search-input');
    if (query) input.value = query;

    function render(results) {
      const container = document.getElementById('search-results');
      if (!query) {
        container.innerHTML = '<p>Введите запрос для поиска по сайту.</p>';
        return;
      }
      if (results.length === 0) {
        container.innerHTML = '<p>Ничего не найдено.</p>';
        return;
      }
      console.log(results);
      container.innerHTML = '<ul class="list-unstyled">' + results.map(r =>
        `<li class="mb-3"><a href="${r.url}"><strong>${r.title}</strong></a><p class="text-muted small">${r.summary}</p></li>`
      ).join('') + '</ul>';
    }

    function search(q) {
      if (!q) return [];
      const lower = q.toLowerCase();
      return SEARCH_INDEX.filter(item =>
        item.title.toLowerCase().includes(lower) ||
        item.summary.toLowerCase().includes(lower)
      ).slice(0, 50);
    }

    render(search(query));

    document.getElementById('search-form').addEventListener('submit', e => {
      e.preventDefault();
      const q = document.getElementById('search-input').value.trim();
      const url = new URL(window.location.href);
      if (q) {
        url.searchParams.set('q', q);
      } else {
        url.searchParams.delete('q');
      }
      window.location.href = url.toString();
    });
  })();
</script>
{{ end }}
